; PlatformIO Project Configuration File
; ESP32 Battery Monitor with Muxed Thermistor Matrix
;
; Build options:
;   - No official ESP-IDF installation required
;   - PlatformIO handles all toolchain dependencies
;   - Easy checkout and build for new developers

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
test_dir = tests
lib_dir = lib

; Common settings for all environments
[common]
build_flags = 
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=3
lib_deps = 
    robtillaart/INA2XX@^0.4.2
    ; Add other lightweight libraries as needed

; ESP32-WROOM (most common dev board)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    ${common.build_flags}
    -DARDUINO_ARCH_ESP32
lib_deps = 
    ${common.lib_deps}

; ESP32-S3 (newer, more GPIO)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    ${common.build_flags}
    -DARDUINO_ARCH_ESP32
lib_deps = 
    ${common.lib_deps}

; ESP32-C3 (RISC-V, low power)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    ${common.build_flags}
    -DARDUINO_ARCH_ESP32
lib_deps = 
    ${common.lib_deps}

; Native unit testing environment (no hardware required)
[env:native]
platform = native
build_flags = 
    -std=c++17
    -I./include
    -I./src
    -DARDUINO_ARCH_ESP32
    -include ./include/config.h
lib_deps = 
    baracodadailyhealthtech/catch2@^3.7.1
test_filter = tests/test_mux.cpp
build_src_filter = +<utils/*.cpp>

; Basic example - single point measurement
[env:basic]
extends = env:esp32dev
build_src_filter = 
    +<*>
    +<../examples/basic/*.cpp>

; Advanced example - full matrix scanning
[env:advanced]
extends = env:esp32dev
build_src_filter = 
    +<*>
    +<../examples/advanced/*.cpp>

; Debug build with verbose logging
[env:debug]
extends = env:esp32dev
build_type = debug
build_flags = 
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DLOG_LOCAL_LEVEL=5
    -DDEBUG_MODE=1

; Release build optimized for size
[env:release]
extends = env:esp32dev
build_type = release
build_flags = 
    ${common.build_flags}
    -Os
    -DCORE_DEBUG_LEVEL=1
