; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
test_dir = tests
lib_dir = lib

[common]
build_flags = 
	-Wall
	-Wextra
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LOCAL_LEVEL=3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	${common.build_flags}
	-DARDUINO_ARCH_ESP32
build_src_filter = 
	+<*>
	-<utils/*_native.cpp>

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	${common.build_flags}
	-DARDUINO_ARCH_ESP32
build_src_filter = 
	+<*>
	-<utils/*_native.cpp>

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	${common.build_flags}
	-DARDUINO_ARCH_ESP32
build_src_filter = 
	+<*>
	-<utils/*_native.cpp>

[env:native]
platform = native
build_flags = 
	-std=c++17
	-I./include
	-I./src
	-include ./include/config.h
lib_deps = 
	baracodadailyhealthtech/catch2@^3.7.1
	file:///workspace/esp32-battery-monitor-native-lib
lib_extra_dirs = 
	../esp32-battery-monitor-native-lib
test_filter = test_mux

[env:basic]
extends = env:esp32dev
build_src_filter = 
	+<*>
	+<../examples/basic/*.cpp>

[env:advanced]
extends = env:esp32dev
build_src_filter = 
	+<*>
	+<../examples/advanced/*.cpp>

[env:debug]
extends = env:esp32dev
build_type = debug
build_flags = 
	${common.build_flags}
	-DCORE_DEBUG_LEVEL=5
	-DLOG_LOCAL_LEVEL=5
	-DDEBUG_MODE=1

[env:release]
extends = env:esp32dev
build_type = release
build_flags = 
	${common.build_flags}
	-Os
	-DCORE_DEBUG_LEVEL=1
